  <h2>Contact</h2>
  <form class="contact-form" action="#" method="post">
    <!-- Champ pour saisir le nom : type text crée une zone de texte ; name identifie la donnée ; required rend le champ obligatoire. -->
    <label for="username">Nom</label>
    <input type="text" id="username" name="username" required />

    <!-- Champ pour saisir l'adresse e-mail : type email vérifie le format de l'adresse ; name identifie la donnée ; required rend le champ obligatoire. -->
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required />

    <!-- Zone de texte pour le message : name identifie la donnée envoyée. -->
    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <!-- Bouton d'envoi : type submit demande au navigateur de soumettre le formulaire. -->
    <button type="submit">Envoyer</button>
  </form>
